version: 2

project_name: cron-doctor

before:
  hooks:
    - go mod tidy

builds:
  - id: cron-doctor
    main: ./cmd/cron-doctor
    binary: cron-doctor
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap publishing. Requires HOMEBREW_TAP_GITHUB_TOKEN with `repo`
# scope on HeytalePazguato/homebrew-tap. Comment out this block until the
# tap repo and secret exist or release will fail at the publish step.
brews:
  - name: cron-doctor
    repository:
      owner: HeytalePazguato
      name: homebrew-tap
      # Explicit token override — without this goreleaser falls back to the
      # workflow's GITHUB_TOKEN, which is scoped to the cron-doctor repo and
      # gets a 403 when pushing to homebrew-tap.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/HeytalePazguato/cron-doctor
    description: "Audit your crontabs"
    license: MIT
    test: |
      system "#{bin}/cron-doctor", "--version"
    skip_upload: auto

# Scoop bucket publishing for Windows users. Requires SCOOP_GITHUB_TOKEN
# (or reuses HOMEBREW_TAP_GITHUB_TOKEN if you scope it that way) with
# `repo` scope on HeytalePazguato/scoop-bucket. Comment out until the
# bucket repo and secret exist.
scoops:
  - name: cron-doctor
    repository:
      owner: HeytalePazguato
      name: scoop-bucket
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
    homepage: https://github.com/HeytalePazguato/cron-doctor
    description: "Audit your crontabs"
    license: MIT
    skip_upload: auto

# Multi-arch GHCR images. Built per-arch then stitched into a manifest list so
# `docker pull ghcr.io/heytalepazguato/cron-doctor` works on amd64 and arm64.
# Auth is handled by the release workflow's `docker login ghcr.io`.
dockers:
  - image_templates:
      - "ghcr.io/heytalepazguato/cron-doctor:{{ .Version }}-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Audit your crontab"
      - "--label=org.opencontainers.image.url=https://github.com/HeytalePazguato/cron-doctor"
      - "--label=org.opencontainers.image.source=https://github.com/HeytalePazguato/cron-doctor"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - image_templates:
      - "ghcr.io/heytalepazguato/cron-doctor:{{ .Version }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Audit your crontab"
      - "--label=org.opencontainers.image.url=https://github.com/HeytalePazguato/cron-doctor"
      - "--label=org.opencontainers.image.source=https://github.com/HeytalePazguato/cron-doctor"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/heytalepazguato/cron-doctor:{{ .Version }}"
    image_templates:
      - "ghcr.io/heytalepazguato/cron-doctor:{{ .Version }}-amd64"
      - "ghcr.io/heytalepazguato/cron-doctor:{{ .Version }}-arm64"
  - name_template: "ghcr.io/heytalepazguato/cron-doctor:latest"
    skip_push: auto # don't move :latest for prereleases (alpha/beta/rc tags)
    image_templates:
      - "ghcr.io/heytalepazguato/cron-doctor:{{ .Version }}-amd64"
      - "ghcr.io/heytalepazguato/cron-doctor:{{ .Version }}-arm64"

release:
  draft: false
  prerelease: auto
