version: 2

project_name: cron-doctor

before:
  hooks:
    - go mod tidy

builds:
  - id: cron-doctor
    main: ./cmd/cron-doctor
    binary: cron-doctor
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap publishing. Requires HOMEBREW_TAP_GITHUB_TOKEN with `repo`
# scope on HeytalePazguato/homebrew-tap. Comment out this block until the
# tap repo and secret exist or release will fail at the publish step.
brews:
  - name: cron-doctor
    repository:
      owner: HeytalePazguato
      name: homebrew-tap
    homepage: https://github.com/HeytalePazguato/cron-doctor
    description: "Audit your crontabs"
    license: MIT
    test: |
      system "#{bin}/cron-doctor", "--version"
    skip_upload: auto

# Scoop bucket publishing for Windows users. Requires SCOOP_GITHUB_TOKEN
# (or reuses HOMEBREW_TAP_GITHUB_TOKEN if you scope it that way) with
# `repo` scope on HeytalePazguato/scoop-bucket. Comment out until the
# bucket repo and secret exist.
scoops:
  - name: cron-doctor
    repository:
      owner: HeytalePazguato
      name: scoop-bucket
    homepage: https://github.com/HeytalePazguato/cron-doctor
    description: "Audit your crontabs"
    license: MIT
    skip_upload: auto

release:
  draft: false
  prerelease: auto
